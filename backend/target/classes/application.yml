spring:
  application:
    name: banking-system
  datasource:
    url: jdbc:postgresql://localhost:5432/banking_system
    username: cbe_user
    password: cbe_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

