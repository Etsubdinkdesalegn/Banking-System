services:
  db:
    image: postgres:16-alpine
    container_name: cbe-banking-db
    environment:
      POSTGRES_USER: cbe_user
      POSTGRES_PASSWORD: cbe_password
      POSTGRES_DB: cbe_banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cbe-banking-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
